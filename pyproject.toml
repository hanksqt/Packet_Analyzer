[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsniff"
version = "0.1.0"
description = "A from-scratch network packet analyzer: hand-written protocol decoders, pcap and live capture."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hank Shih" }]
keywords = ["networking", "packet", "pcap", "analyzer", "ethernet", "tcp", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]
# The core is pure standard library, on purpose. Anything listed here would be a
# runtime dependency a cloner has to install; there are none.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/hanksqt/Packet_Analyzer"
Source = "https://github.com/hanksqt/Packet_Analyzer"

[project.scripts]
netsniff = "netsniff.cli:main"

[tool.setuptools.packages.find]
include = ["netsniff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
# Analyse as Linux even when running on Windows. capture/live.py uses AF_PACKET,
# recvmsg and geteuid, which typeshed only declares on Unix; without this, mypy
# on a Windows workstation reports four errors for code that is correct on the
# platform it targets - and, worse, skips type-checking it entirely.
platform = "linux"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
